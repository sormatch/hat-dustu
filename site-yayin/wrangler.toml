name = "hatdustu"
compatibility_date = "2025-09-01"
main = "worker.js"  # yalnız www -> hatdustu.app yönlendirmesi; dosyalar [assets]

# Kendi alan adımız (Cloudflare'de, İsimtescil'den alındı)
routes = [
  { pattern = "hatdustu.app", custom_domain = true },
  { pattern = "www.hatdustu.app", custom_domain = true },
]

# Yasal sayfalar oyun sunucusundan (worker.js YASAL)
[[services]]
binding = "OYUN"
service = "hat-dustu"

# Vizo 3D/AR menü demosu (hatdustu.app/vizo) ayrı worker: worker.js /vizo isteklerini buraya iletir
[[services]]
binding = "VIZO"
service = "vizo"

# Android APK indirme (worker.js apkIndir)
[[r2_buckets]]
binding = "INDIR"
bucket_name = "hatdustu-indir"

# Tanıtım sitesi (hatdustu.app): yalnız durağan dosyalar, site/ klasöründen yayınlanır
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
