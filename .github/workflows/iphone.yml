# Mac olmadan iPhone sürümü: GitHub'ın Mac sunucusunda imzasız HatDustu.ipa üretir.
# Telefona kurulum Windows'ta Sideloadly ile (kendi Apple kimliğinle imzalanır).
name: iPhone surumu
# Sadece elle başlatılır (GitHub > Actions > Run workflow); testler bilgisayarda yapılıyor.
on:
  workflow_dispatch:
concurrency:
  group: iphone
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Godot önbelleği
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-ios
      - name: Godot ve iOS şablonunu indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          V=${GODOT_VERSION}-stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_macos.universal.zip
          mkdir -p godot && unzip -q godot.zip -d godot && rm godot.zip
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j tpl.tpz templates/ios.zip templates/version.txt -d "$T" && rm tpl.tpz
          ls -la "$T"
      # Uygulama içi satın alma (StoreKit 2): GodotApplePlugins (MIT, Miguel de Icaza / xibbon), hazır derlenmiş
      # GDExtension. Repoda durmaz (iOS çerçeveleri ~70 MB); her derlemede sabit sürüm indirilir, SHA-256 denetlenir,
      # yalnız StoreKit + ortak Swift çalışma zamanı addons/ altına kopyalanır. İçe aktarma bunu görüp
      # .godot/extension_list.cfg'ye yazar, iOS dışa aktarma xcframework'leri Xcode projesine gömer.
      # (En az iOS 17.0 ister: export_presets.cfg min_ios_version 17.0.) Yeni sürüm: URL ve SHA256'yı birlikte değiştir.
      - name: StoreKit eklentisini indir (GodotApplePlugins)
        env:
          GAP_URL: https://github.com/xibbon/GodotApplePlugins/releases/download/build-a66f619a253cbc39922ff9018b2307b6ec6862cc/GodotApplePlugins-addons-a66f619a253cbc39922ff9018b2307b6ec6862cc.zip
          GAP_SHA256: b9f36eba95228659f1e27629e7b36ad787c0c22a3405a187198b3cc415e6be21
        run: |
          curl -fsSL -o gap.zip "$GAP_URL"
          echo "$GAP_SHA256  gap.zip" | shasum -a 256 -c -
          mkdir -p gap && unzip -q gap.zip -d gap
          rm -rf addons/GodotApplePluginsStoreKit addons/GodotApplePluginsRuntime
          mkdir -p addons
          cp -R gap/dist/addons/GodotApplePluginsStoreKit gap/dist/addons/GodotApplePluginsRuntime addons/
          rm -rf gap gap.zip
          cat addons/GodotApplePluginsStoreKit/godot_apple_plugins_storekit.gdextension
          ls -la addons/GodotApplePluginsStoreKit/bin addons/GodotApplePluginsRuntime/bin
      - name: Varlıkları içe aktar
        run: |
          godot/Godot.app/Contents/MacOS/Godot --headless --path . --import
          # StoreKit eklentisi dışa aktarmaya girecek mi (Godot yalnız bu listedeki GDExtension'ları dışa aktarır)
          # (dosya düz metin: satır başına bir .gdextension yolu; içe aktarma yazmadıysa elle eklenir)
          grep -qs godot_apple_plugins_storekit .godot/extension_list.cfg || {
            echo "::warning::extension_list.cfg içinde StoreKit yoktu, elle eklendi"
            echo "res://addons/GodotApplePluginsStoreKit/godot_apple_plugins_storekit.gdextension" >> .godot/extension_list.cfg
          }
          cat .godot/extension_list.cfg
      - name: Xcode projesini üret
        run: |
          mkdir -p build/ios
          # Gölgelendirici fırını (ekranlı dışa aktarma) GitHub'ın macOS makinesinde görüntü aygıtı olmadığı için
          # 25 dk takılıp düşüyordu (26 Ekim 2026); doğrudan --headless (fırınsız) üretilir. Açılıştaki ısıtma
          # (scripts/acilis.gd) ilk maçtaki derleme donmasını zaten önler.
          godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/HatDustu.ipa
          ls -la build/ios
          # StoreKit çerçeveleri Xcode projesine kopyalandı mı (yoksa oyun açılır ama paketler "YAKINDA" kalır)
          find build/ios -maxdepth 3 -name "*.xcframework" -print | grep -E "GodotApplePluginsStoreKit|SwiftGodotRuntime" \
            || echo "::warning::StoreKit xcframework Xcode projesinde bulunamadı: satın alma kapalı kalacak"
      - name: İmzasız derle
        run: |
          cd build/ios
          xcodebuild -project HatDustu.xcodeproj -scheme HatDustu -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
      - name: HatDustu.ipa paketle
        run: |
          APP=$(find build/ios/dd/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          test -n "$APP" || { echo "Uygulama bulunamadı"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry HatDustu.ipa Payload && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: HatDustu-iPhone
          path: out/HatDustu.ipa
          retention-days: 30
