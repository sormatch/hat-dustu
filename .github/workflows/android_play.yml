# Google Play sürümü: GitHub'ın Linux sunucusunda imzalı HatDustu.aab (Android App Bundle) üretir.
# Telefona doğrudan kurulmaz; Play Console'a yüklenir. Telefona kurulacak APK için android.yml kullanılır.
# "Android Play" ön ayarı (export_presets.cfg) Gradle ile derler; bunun için Android derleme şablonu her
# derlemede export şablonlarındaki android_source.zip'ten res://android/build klasörüne açılır
# (Godot düzenleyicisindeki "Proje > Android Derleme Şablonunu Yükle" adımının aynısı).
# Gerekli GitHub sırları (Settings > Secrets and variables > Actions):
#   PLAY_KEYSTORE_BASE64   yükleme anahtarı dosyası (upload keystore), base64
#   PLAY_KEYSTORE_ALIAS    anahtar takma adı
#   PLAY_KEYSTORE_PASSWORD anahtar şifresi
name: Android Play surumu (AAB)
on:
  workflow_dispatch:
concurrency:
  group: android-play
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot önbelleği
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle
      - name: Godot ve Android şablonlarını indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          V=${GODOT_VERSION}-stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          mkdir -p godot && unzip -q godot.zip -d godot && rm godot.zip
          mv godot/Godot_v${V}_linux.x86_64 godot/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j tpl.tpz templates/android_source.zip templates/android_release.apk templates/android_debug.apk templates/version.txt -d "$T" && rm tpl.tpz
          ls -la "$T"
      - name: Android derleme şablonunu kur (res://android/build)
        run: |
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf android && mkdir -p android/build
          unzip -q "$T/android_source.zip" -d android/build
          printf '%s' "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          # Gradle belleği en fazla 3 GB (bilgisayarda da aynı sınır; şablondaki varsayılan daha yüksek)
          if grep -q '^org.gradle.jvmargs' android/build/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m/' android/build/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m' >> android/build/gradle.properties
          fi
          grep jvmargs android/build/gradle.properties
      - name: Anahtarı ve Godot ayarlarını yaz
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$PLAY_KEYSTORE_BASE64" || { echo "PLAY_KEYSTORE_BASE64 sırrı yok (magaza/kontrol_listesi.md)"; exit 1; }
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > ~/upload.keystore
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > ~/.config/godot/$f
          done
      - name: Varlıkları içe aktar
        run: godot/godot --headless --path . --import
      - name: AAB üret
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.PLAY_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot/godot --headless --path . --export-release "Android Play" build/android/HatDustu.aab
          ls -la build/android
          test -f build/android/HatDustu.aab
      - uses: actions/upload-artifact@v4
        with:
          name: HatDustu-Play-AAB
          path: build/android/HatDustu.aab
          retention-days: 30
