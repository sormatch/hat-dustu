name = "hat-dustu"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Elmas satın alma test modu: "1" olursa elmas bedava verilir (yalnız yerel test). Canlıda "0" kalmalı.
[vars]
ODEME_TEST = "0"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[durable_objects.bindings]]
name = "ESLESTIRME"
class_name = "Eslestirme"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Eslestirme"]

[[durable_objects.bindings]]
name = "ODALAR"
class_name = "Odalar"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Odalar"]
