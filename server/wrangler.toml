name = "hat-dustu"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Elmas satın alma test modu: makbuz doğrulaması bağlanana kadar elmas doğrudan verilir. YAYINDAN ÖNCE "0" YAP.
[vars]
ODEME_TEST = "1"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[durable_objects.bindings]]
name = "ESLESTIRME"
class_name = "Eslestirme"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Eslestirme"]
